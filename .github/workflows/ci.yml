# CI — 自测 / 构建
#
# 触发：
#   push(main)      代码变更 → 自测 → 构建
#   pull_request    只跑自测 + 构建（用仓库内快照，PR 不打上游）
#   workflow_dispatch  Actions 页面手动「Run workflow」按钮
#
# 不部署 GitHub Pages：线上走自托管实时服务（阿里云 ECS 常驻 `npm run serve`，
# 见 deploy/aliyun.md，服务内自带行情抓取循环），代码更新由服务器上的
# deploy/update.sh 完成，与本 CI 无关。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 离线自测（子弹行情 + 异动雷达 + 特勤处制造 + 官方源 + TTK 对账 + 账号）
        run: |
          node server/ammo/selftest.mjs
          node server/market/selftest.mjs
          node server/craft/selftest.mjs
          node server/official/selftest.mjs
          node server/ttk/selftest.mjs
          node server/auth/selftest.mjs

      - name: 契约校验（fixtures + 线上三份静态快照逐份对照 shared/schema/，schema 漂移或数据越界即失败）
        run: npm run contract:check

      - name: TTK 导出对账（改 ttk 三件套任一数值后必须先 npm run export:ios 重生成 shared/data/ttk.json，任一值漂移即失败）
        run: |
          npm run export:ios
          git diff --exit-code shared/data/

      - run: npm run build
