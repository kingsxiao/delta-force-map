# project.yml — xcodegen 工程描述（apps/ios）
# 生成：cd apps/ios && xcodegen generate   →  DeltaForce.xcodeproj（已提交；改本文件后重新生成）
# 多端 monorepo 约定：共享数据不复制进 iOS 目录，以文件 / 文件夹引用捆绑：
#   ../../shared/data/ttk.json           TTK 数据（npm run export:ios 产出）
#   ../web/public/guns                   官方枪械渲染图（文件夹引用，bundle 内保留 guns/ 子目录）
name: DeltaForce
options:
  bundleIdPrefix: com.kingsxiao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: S4R9UW3RSD
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Release:
      # 体积优先：全模块优化 + -Osize + Thin LTO + 归档期符号剥离（dSYM 存于 xcarchive，崩溃符号化不受影响）
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      GCC_OPTIMIZATION_LEVEL: s
      LLVM_LTO: YES_THIN
      DEPLOYMENT_POSTPROCESSING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"
      STRIP_STYLE: all
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

packages:
  DeltaForceCore:
    path: Packages/DeltaForceCore

targets:
  DeltaForce:
    type: application
    platform: iOS
    sources:
      - path: DeltaForce
      - path: ../../shared/data/ttk.json
        buildPhase: resources
      - path: ../web/public/guns
        type: folder
        buildPhase: resources
    dependencies:
      - package: DeltaForceCore
    info:
      path: DeltaForce/Info.plist
      properties:
        CFBundleDisplayName: 三角洲行动助手
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # 自托管后端常见形态是 http://IP:8080（未备案 / 内网），放行明文；上 https 后可收紧
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingsxiao.deltaforce
        TARGETED_DEVICE_FAMILY: "1,2"
        # Apple Silicon Mac 可直接运行（App Store 的「Designed for iPad」形态）；本机无模拟器 runtime 时
        # 也可用 xcodebuild -destination 'platform=macOS,variant=Designed for [iPad]' 跑起来做 UI 验证
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "NO"

schemes:
  DeltaForce:
    build:
      targets:
        DeltaForce: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    archive:
      config: Release
